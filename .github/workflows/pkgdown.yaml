name: pkgdown

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pkgdown
  # Queue rather than cancel: an in-flight `rsync --delete` interrupted
  # mid-transfer would leave the live site partially deleted.
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    # The pkgdown-deploy environment's branch policy (repo settings) is the
    # real gate; this `if` only guards the accidental case.
    if: github.ref == 'refs/heads/master'
    environment: pkgdown-deploy
    runs-on: homelab

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown
          needs: website

      - name: Build pkgdown site
        shell: Rscript {0}
        run: pkgdown::build_site(override = list(destination = "pkgdown-site"))

      - name: Deploy pkgdown site
        # The key's forced rrsync command on the dev-sites host confines it
        # to /srv/dev-sites/finRes; StrictHostKeyChecking=yes trusts only the
        # host key already in the runner's known_hosts.
        run: |
          rsync \
            --archive \
            --delete \
            --verbose \
            -e "ssh -i /home/github-actions/.ssh/finres_deploy -o StrictHostKeyChecking=yes" \
            pkgdown-site/ \
            finres-deploy@192.168.0.55:/

      - name: Verify deployment
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            https://dev.bautheac.net/finRes/ >/dev/null
